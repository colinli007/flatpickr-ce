name: 'GitHub Actions'

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  tests:
    name: 'tests'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - uses: bahmutov/npm-install@v1
    - run: npm test

  prettier:
    name: 'prettier'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: bahmutov/npm-install@v1
      - run: npm run fmt:check
